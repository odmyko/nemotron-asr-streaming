<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nemotron ASR — live transcription</title>
<style>
  :root{ --bg:#0b1020; --card:#151b2e; --fg:#eaf0ff; --muted:#90a0c0;
         --green:#2ecc71; --red:#ff5a5f; --blue:#4a8cff; --line:#2a3350; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       min-height:100dvh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:820px;padding:1.1rem 1rem .4rem}
  h1{font-size:1.25rem;margin:0}
  .sub{color:var(--muted);font-size:.85rem;margin-top:.25rem}
  main{width:100%;max-width:820px;padding:0 1rem 2rem;flex:1;display:flex;flex-direction:column}
  .bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.8rem 0}
  select{background:var(--card);color:var(--fg);border:1px solid var(--line);
         border-radius:10px;padding:.55rem .7rem;font-size:1rem}
  .btns{display:flex;gap:.6rem;margin:.4rem 0 .9rem;flex-wrap:wrap}
  button{border:0;border-radius:14px;padding:.9rem 1.2rem;font-size:1.05rem;font-weight:600;
         color:#fff;cursor:pointer;flex:1;min-width:120px}
  button:disabled{opacity:.4;cursor:not-allowed}
  #start{background:var(--green)} #stop{background:var(--red)} #clear{background:#39406a}
  .status{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.9rem;margin-bottom:.4rem}
  .dot{width:.7rem;height:.7rem;border-radius:50%;background:#555;transition:.2s}
  .dot.live{background:var(--green);box-shadow:0 0 0 0 rgba(46,204,113,.6);animation:pulse 1.3s infinite}
  .dot.err{background:var(--red)} .dot.wait{background:#e2b93b}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}70%{box-shadow:0 0 0 12px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  #transcript{background:var(--card);border:1px solid var(--line);border-radius:14px;
              padding:1rem;min-height:34vh;font-size:1.15rem;line-height:1.5;white-space:pre-wrap;
              overflow:auto;flex:1}
  .final{opacity:.95} .partial{color:var(--blue)}
  .hint{color:var(--muted);font-size:.78rem;margin-top:.8rem}
  a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <h1>🎙️ Nemotron 3.5 ASR — live streaming</h1>
  <div class="sub">Cache-aware multilingual speech-to-text, running on your GPU.</div>
</header>
<main>
  <div class="bar">
    <label for="lang" style="color:var(--muted)">Language</label>
    <select id="lang"><option value="auto">auto-detect</option></select>
  </div>
  <div class="btns">
    <button id="start">▶ Start</button>
    <button id="stop" disabled>⏹ Stop</button>
    <button id="clear">🗑 Clear</button>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">idle</span></div>
  <div id="transcript"></div>
  <div class="hint" id="hint"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const startBtn=$('#start'), stopBtn=$('#stop'), clearBtn=$('#clear');
const langSel=$('#lang'), dot=$('#dot'), statusText=$('#statusText');
const transcript=$('#transcript'), hint=$('#hint');

let ws, ctx, src, proc, stream;
let finalText = "";   // accumulated finalized segments

function setStatus(text, cls){ statusText.textContent=text; dot.className='dot'+(cls?' '+cls:''); }
function render(partial){
  transcript.innerHTML =
    `<span class="final">${escapeHtml(finalText)}</span>` +
    (partial ? `<span class="partial">${escapeHtml(partial)}</span>` : '');
  transcript.scrollTop = transcript.scrollHeight;
}
function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// Populate languages from the API (same-origin, proxied by nginx).
fetch('/languages').then(r=>r.json()).then(d=>{
  (d.languages||[]).forEach(l=>{ if(l==='auto')return;
    const o=document.createElement('option'); o.value=o.textContent=l; langSel.appendChild(o); });
}).catch(()=>{ hint.textContent='Could not reach API /languages.'; });

function floatToPcm16(f32){
  const out=new Int16Array(f32.length);
  for(let i=0;i<f32.length;i++){ let s=Math.max(-1,Math.min(1,f32[i])); out[i]=s<0?s*0x8000:s*0x7fff; }
  return out;
}

async function start(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('mic blocked — needs a secure context','err');
    hint.innerHTML='Microphone access requires a <b>secure context</b>: open this page via <b>http://localhost:8080</b> on the host, or serve it over <b>HTTPS</b> for other devices (see the README "Microphone &amp; HTTPS" section).';
    return;
  }
  try{
    setStatus('requesting microphone…','wait');
    stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
  }catch(e){ setStatus('microphone denied','err'); hint.textContent=String(e); return; }

  ctx = new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') await ctx.resume();
  const sr = ctx.sampleRate;
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws/transcribe?language=${encodeURIComponent(langSel.value)}&sample_rate=${sr}&strip_lang_tags=true`;
  ws = new WebSocket(url);
  ws.binaryType='arraybuffer';

  ws.onopen = ()=>{
    setStatus('listening…','live');
    src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096,1,1);
    proc.onaudioprocess = ev=>{
      if(ws && ws.readyState===1)
        ws.send(floatToPcm16(ev.inputBuffer.getChannelData(0)).buffer);
    };
    src.connect(proc); proc.connect(ctx.destination);
  };
  ws.onmessage = e=>{
    const m = JSON.parse(e.data);
    if(m.type==='partial') render(m.text);
    else if(m.type==='final'){ finalText = (m.text||'').trim(); render(''); finalText += finalText?' ':''; }
    else if(m.type==='error'){ setStatus('error','err'); hint.textContent=m.detail||'error'; }
  };
  ws.onclose = ()=>{ if(stopBtn.disabled===false) stopStreaming(); };
  ws.onerror = ()=>{ setStatus('connection error','err'); };

  startBtn.disabled=true; stopBtn.disabled=false;
  langSel.disabled=true;
}

function stopStreaming(){
  try{ if(proc){proc.disconnect(); proc.onaudioprocess=null;} if(src)src.disconnect(); }catch(e){}
  try{ if(stream)stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(ctx && ctx.state!=='closed')ctx.close(); }catch(e){}
  if(ws && ws.readyState===1){ ws.send(JSON.stringify({type:'end'})); }
  setStatus('stopped');
  startBtn.disabled=false; stopBtn.disabled=true; langSel.disabled=false;
}

startBtn.onclick=start;
stopBtn.onclick=stopStreaming;
clearBtn.onclick=()=>{ finalText=""; render(''); if(stopBtn.disabled) setStatus('idle'); };
render('');
</script>
</body>
</html>
