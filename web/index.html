<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nemotron ASR — live transcription</title>
<style>
  :root{ --bg:#0b1020; --card:#151b2e; --fg:#eaf0ff; --muted:#90a0c0;
         --green:#2ecc71; --red:#ff5a5f; --blue:#4a8cff; --line:#2a3350; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       min-height:100dvh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:820px;padding:1.1rem 1rem .4rem}
  h1{font-size:1.25rem;margin:0}
  .sub{color:var(--muted);font-size:.85rem;margin-top:.25rem}
  main{width:100%;max-width:820px;padding:0 1rem 2rem;flex:1;display:flex;flex-direction:column}
  .bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.8rem 0}
  select{background:var(--card);color:var(--fg);border:1px solid var(--line);
         border-radius:10px;padding:.55rem .7rem;font-size:1rem}
  .btns{display:flex;gap:.6rem;margin:.4rem 0 .9rem;flex-wrap:wrap}
  button{border:0;border-radius:14px;padding:.9rem 1.2rem;font-size:1.05rem;font-weight:600;
         color:#fff;cursor:pointer;flex:1;min-width:120px}
  button:disabled{opacity:.4;cursor:not-allowed}
  #start{background:var(--green)} #stop{background:var(--red)} #clear{background:#39406a}
  .status{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.9rem;margin-bottom:.4rem}
  .dot{width:.7rem;height:.7rem;border-radius:50%;background:#555;transition:.2s}
  .dot.live{background:var(--green);box-shadow:0 0 0 0 rgba(46,204,113,.6);animation:pulse 1.3s infinite}
  .dot.err{background:var(--red)} .dot.wait{background:#e2b93b}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}70%{box-shadow:0 0 0 12px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  #transcript{background:var(--card);border:1px solid var(--line);border-radius:14px;
              padding:1rem;min-height:34vh;max-height:60dvh;font-size:1.15rem;line-height:1.5;white-space:pre-wrap;
              overflow:auto;flex:1}
  .final{opacity:.95} .partial{opacity:.72}
  .turn{margin:0 0 1rem;padding-left:.8rem;border-left:3px solid var(--speaker,var(--blue))}
  .speaker{color:var(--speaker,var(--blue));font-size:.8rem;font-weight:700;display:block}
  .toggle{display:flex;gap:.4rem;align-items:center;color:var(--fg)}
  .upload{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
  .upload button{padding:.5rem;font-size:.9rem;min-width:0;flex:0}
  input[type=file]{max-width:100%;color:var(--muted)}
  .hint{color:var(--muted);font-size:.78rem;margin-top:.8rem}
  a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <h1>🎙️ Nemotron 3.5 ASR — live streaming</h1>
  <div class="sub">Cache-aware multilingual speech-to-text, running on your GPU.</div>
</header>
<main>
  <div class="bar">
    <label for="lang" style="color:var(--muted)">Language</label>
    <select id="lang"><option value="auto">auto-detect</option></select>
    <label class="toggle"><input type="checkbox" id="diarize" disabled> Separate speakers</label>
  </div>
  <div class="btns">
    <button id="start">▶ Start</button>
    <button id="stop" disabled>⏹ Stop</button>
    <button id="clear">🗑 Clear</button>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">idle</span></div>
  <div id="transcript"></div>
  <div class="hint" id="hint">Speaker labels belong to this recording. They may update as you speak.</div>
  <div class="upload">
    <label>Audio file (plain transcription): <input type="file" id="fileInput" accept="audio/*"></label>
    <button id="upload">Transcribe file</button>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const startBtn=$('#start'), stopBtn=$('#stop'), clearBtn=$('#clear');
const langSel=$('#lang'), diarize=$('#diarize'), dot=$('#dot'), statusText=$('#statusText');
const transcript=$('#transcript'), hint=$('#hint'), uploadBtn=$('#upload');
const colors=['#73a7ff','#6edbae','#ffbf73','#dc9bff','#ff8caa','#73dbe0','#cedb73','#c7b3a0'];
let state='idle', active=null, history=[], current=[], clearPoint=0, diarAvailable=false;
function setStatus(text, cls=''){statusText.textContent=text;dot.className='dot '+cls;}
function controls(){
  const busy=state!=='idle';
  startBtn.disabled=busy;stopBtn.disabled=state!=='recording';
  langSel.disabled=busy;diarize.disabled=busy||!diarAvailable;uploadBtn.disabled=busy;
  $('#fileInput').disabled=busy;
}
function render(){
  const oldScroll=transcript.scrollTop;
  const follow=transcript.scrollHeight-transcript.scrollTop-transcript.clientHeight<70;
  const fragment=document.createDocumentFragment();
  for(const segment of [...history,...current]){
    if(segment.hidden||!segment.text.slice(segment.clearChars||0))continue;
    const row=document.createElement('div');
    row.className=(segment.speaker_id?'turn ':'')+(segment.final?'final':'partial');
    if(segment.speaker_id){
      const index=Number(segment.speaker_id.split('_').pop());
      row.style.setProperty('--speaker',colors[index%colors.length]);
      const name=document.createElement('span');name.className='speaker';
      name.textContent=`Speaker ${index+1}`;
      row.append(name);
    }
    row.append(document.createTextNode(segment.text.slice(segment.clearChars||0)));
    fragment.append(row);
  }
  transcript.replaceChildren(fragment);
  transcript.scrollTop=follow?transcript.scrollHeight:oldScroll;
}
function updateTranscript(message){
  const incoming=Array.isArray(message.segments)?message.segments:
    [{text:message.text||'',speaker_id:null,final:message.type==='final'}];
  current=incoming.map((s,i)=>({...s,final:message.type==='final'||s.final,
    hidden:i<clearPoint,clearChars:i===clearPoint?(active?.clearChars||0):0}));
  render();
}
function releaseMicrophone(session){
  if(!session)return;
  if(session.proc){session.proc.onaudioprocess=null;session.proc.disconnect();}
  if(session.src)session.src.disconnect();
  if(session.stream)session.stream.getTracks().forEach(t=>t.stop());
  if(session.ctx&&session.ctx.state!=='closed')session.ctx.close().catch(()=>{});
}
function finish(session,error){
  if(active!==session)return;
  releaseMicrophone(session);
  history.push(...current);current=[];
  active=null;state='idle';clearPoint=0;
  controls();setStatus(error?'error':'stopped',error?'err':'');
  if(error)hint.textContent=error;
  render();
}
function pcm16(samples){
  const data=new ArrayBuffer(samples.length*2),view=new DataView(data);
  for(let i=0;i<samples.length;i++){
    const value=Math.max(-1,Math.min(1,samples[i]));
    view.setInt16(i*2,value<0?value*32768:value*32767,true);
  }
  return data;
}
async function start(){
  if(state!=='idle')return;
  if(!navigator.mediaDevices?.getUserMedia){
    setStatus('Microphone requires localhost or HTTPS','err');return;
  }
  const session={};active=session;state='connecting';controls();setStatus('requesting microphone...','wait');
  hint.textContent='Speaker labels belong to this recording and may update as you speak.';
  clearPoint=0;current=[];
  try{
    session.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    session.ctx=new (window.AudioContext||window.webkitAudioContext)();
    await session.ctx.resume();
    const proto=location.protocol==='https:'?'wss':'ws';
    const params=new URLSearchParams({language:langSel.value,sample_rate:session.ctx.sampleRate,
      strip_lang_tags:'true',diarize:String(diarize.checked)});
    session.ws=new WebSocket(`${proto}://${location.host}/ws/transcribe?${params}`);
    session.ws.onmessage=event=>{
      if(active!==session)return;
      const message=JSON.parse(event.data);
      if(message.type==='ready'){
        session.src=session.ctx.createMediaStreamSource(session.stream);
        session.proc=session.ctx.createScriptProcessor(4096,1,1);
        session.proc.onaudioprocess=e=>{
          if(state==='recording'&&session.ws.readyState===WebSocket.OPEN){
            if(session.ws.bufferedAmount>session.ctx.sampleRate*2*10){
              finish(session,'Connection too slow; recording stopped.');session.ws.close();return;
            }
            session.ws.send(pcm16(e.inputBuffer.getChannelData(0)));
          }
        };
        session.src.connect(session.proc);session.proc.connect(session.ctx.destination);
        state='recording';controls();setStatus('listening...','live');
      }else if(message.type==='partial'||message.type==='final'){
        updateTranscript(message);
        if(message.type==='final'){finish(session);session.ws.close();}
      }else if(message.type==='error'){
        finish(session,message.detail||'Transcription failed');session.ws.close();
      }
    };
    session.ws.onclose=()=>{
      if(active===session)finish(session,'Connection closed before final transcript. Displayed text is preserved.');
    };
    session.ws.onerror=()=>{finish(session,'Connection error');session.ws.close();};
  }catch(error){finish(session,String(error));}
}
function stop(){
  if(state!=='recording'||!active)return;
  state='finishing';controls();setStatus('finishing...','wait');
  releaseMicrophone(active);
  if(active.ws.readyState===WebSocket.OPEN)active.ws.send(JSON.stringify({type:'end'}));
  else finish(active,'Connection closed before final transcript.');
}
startBtn.onclick=start;stopBtn.onclick=stop;
clearBtn.onclick=()=>{
  history=[];
  if(active){
    clearPoint=Math.max(0,current.length-1);
    active.clearChars=current.at(-1)?.text.length||0;
    current=current.map((s,i)=>({...s,hidden:i<clearPoint,clearChars:i===clearPoint?active.clearChars:0}));
  }else current=[];
  render();
};
uploadBtn.onclick=async()=>{
  const file=$('#fileInput').files[0];if(!file||state!=='idle')return;
  state='uploading';controls();setStatus('transcribing file...','wait');
  const body=new FormData();body.append('file',file);body.append('language',langSel.value);
  try{
    const response=await fetch('/transcribe',{method:'POST',body});const result=await response.json();
    if(!response.ok)throw new Error(result.detail||'Upload failed');
    history.push({text:result.text,final:true});render();setStatus('file transcribed');
  }catch(error){setStatus('error','err');hint.textContent=String(error);}
  finally{state='idle';controls();}
};
fetch('/languages').then(r=>r.json()).then(data=>{
  for(const language of data.languages||[]){
    if(language==='auto')continue;const option=document.createElement('option');
    option.value=option.textContent=language;langSel.append(option);
  }
}).catch(()=>{hint.textContent='Could not reach API /languages.';});
fetch('/health').then(r=>r.json()).then(data=>{
  diarAvailable=!!data.diarization?.available;controls();
  if(!diarAvailable)hint.textContent=data.diarization?.detail||'Speaker separation is unavailable on this server.';
}).catch(()=>{hint.textContent='Could not check speaker separation availability.';});
controls();render();
</script>
</body>
</html>
