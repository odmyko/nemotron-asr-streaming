services:
  asr:
    build: .
    image: nemotron-asr-streaming:latest
    container_name: nemotron-asr-streaming
    ports:
      - "8000:8000" # reachable on 0.0.0.0 -> other devices on the LAN
    volumes:
      - ./model_cache:/models:ro
      - ./transcripts:/transcripts
    environment:
      MODEL_PATH: /models/nemotron-3.5-asr-streaming-0.6b/nemotron-3.5-asr-streaming-0.6b.nemo
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      DIAR_MODEL_PATH: /models/Nemotron-3-Diarization/Nemotron-3-Diarization.nemo
      DIAR_ENABLED: ${DIAR_ENABLED:-1}
      TRANSCRIPT_DIR: /transcripts
      TRANSCRIPT_SAVE_ENABLED: ${TRANSCRIPT_SAVE_ENABLED:-1}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)" ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s

  web:
    build: ./web
    image: nemotron-asr-web:latest
    container_name: nemotron-asr-web
    ports:
      - "8080:8080"
    environment:
      API_UPSTREAM: asr:8000
    depends_on:
      - asr
    restart: unless-stopped
